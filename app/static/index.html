<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品知识问答演示</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#16253a;background:#f2f5f9}
*{box-sizing:border-box}body{margin:0}header{background:#12335a;color:#fff;padding:18px max(20px,calc((100vw - 1120px)/2))}header h1{margin:0;font-size:22px}header small{color:#c3d9ed}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;max-width:1160px;margin:20px auto;padding:0 18px;align-items:start}
.card{background:white;border:1px solid #dce4ef;border-radius:14px;padding:18px;box-shadow:0 2px 8px #142a4010}
h2{font-size:16px;margin:0 0 16px}label{display:block;font-size:13px;color:#50637a;margin:12px 0 5px}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #cbd7e4;border-radius:8px;padding:9px;background:white}
textarea{min-height:75px}button{border:0;border-radius:8px;padding:10px 14px;background:#1263a6;color:#fff;cursor:pointer}button:hover{background:#0e4c80}button.secondary{background:#e8f1f8;color:#13436a}
.chat{display:flex;flex-direction:column;min-height:690px}.scope-fields{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;margin-bottom:8px}.scope-fields label{margin-top:0}.messages{flex:1;overflow:auto;max-height:470px;padding-right:6px}.product-chooser{background:#eef5fc;border:1px solid #d8e7f5;border-radius:12px;padding:12px 14px;max-height:185px;overflow:auto;margin:0}.product-chooser:not([open]){max-height:none}.product-chooser summary{cursor:pointer;font-weight:600;line-height:1.5;padding-right:48px;position:relative}.product-chooser summary::after{content:'收起';position:absolute;right:0;top:0;color:#1263a6;font-size:12px}.product-chooser:not([open]) summary::after{content:'展开'}
.bubble{border-radius:12px;padding:12px 14px;margin:10px 0;max-width:90%;white-space:pre-wrap;line-height:1.55}.user{background:#dceffc;margin-left:auto}.bot{background:#f1f5f9}
.answer-text{white-space:pre-wrap;overflow-wrap:anywhere}.citation{display:flex;flex-direction:column;align-items:flex-end;margin-top:7px}.citation-trigger{width:25px;height:25px;padding:0;border:1px solid #8aaaca;border-radius:50%;background:#e2eef8;color:#195b91;font-size:16px;font-weight:700;line-height:1}.citation-trigger:hover,.citation-trigger:focus-visible{background:#cce2f4;color:#10446d}.citation-panel{display:none;align-self:stretch;padding:10px 12px;background:#fff;border:1px solid #cbdbe9;border-radius:9px;box-shadow:0 4px 12px #102b4418;font-size:12px;line-height:1.5;max-height:260px;overflow:auto;white-space:normal}.citation-trigger:hover+.citation-panel,.citation-trigger:focus-visible+.citation-panel,.citation-panel:hover,.citation.is-open .citation-panel{display:block}.citation-panel strong{display:block;margin-bottom:7px}.citation-source{border-top:1px solid #e4ebf2;padding:8px 0}.citation-source:first-of-type{border-top:0}.citation-source-label{font-weight:600;color:#28577d}.citation-source-text{margin-top:4px;color:#50637a;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;gap:8px}.row>*{flex:1}.composer{border-top:1px solid #e4ebf2;padding-top:12px}.composer-actions{display:flex;align-items:center;gap:8px;margin-top:9px}.composer-actions #send{flex:1}.composer-actions .secondary{font-size:13px}.sidebar>details{margin-top:0;padding:13px 0}.sidebar>details:first-of-type{border-top:0}.sidebar summary{color:#18466d}.sidebar h2{margin-bottom:4px}.section-note{margin:5px 0 10px}.search-tools{border:0;padding:0;margin:0 0 8px}.search-tools summary{font-size:12px;font-weight:500;color:#1263a6}.search-tools .search-row{margin:8px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#f3f7fb;padding:10px;border-radius:8px}.stat strong{display:block;font-size:20px}
.bar{height:12px;background:#e7eef5;border-radius:8px;overflow:hidden;margin:4px 0 11px}.bar span{display:block;height:100%;background:#3585bf}.barlabel{font-size:12px;color:#50637a}
.hint{font-size:12px;color:#66788b;line-height:1.5}.error{color:#b52525;font-size:13px}details{margin-top:16px;border-top:1px solid #e4ebf2;padding-top:12px}summary{cursor:pointer;font-weight:600}ul{padding-left:18px;font-size:13px;line-height:1.8}
.product-list{margin:8px 0 0;padding-left:24px}.product-list li{margin:4px 0}.product-link{padding:5px 8px;background:transparent;color:#1263a6;text-align:left;font-weight:600}.product-link:hover{background:#dceffc;color:#0e4c80}.search-row{display:flex;gap:7px;margin:8px 0 12px}.search-row input{flex:1;min-width:0}.search-row button{white-space:nowrap}
.faq-suggestions{background:#f7fafc;border:1px solid #e1ebf3;border-radius:10px;padding:11px 13px;margin:10px 0}.faq-suggestions strong{display:block;font-size:13px;margin-bottom:8px}.faq-suggestions button{display:block;text-align:left;width:100%;margin:5px 0;padding:7px 9px;background:#eaf3fa;color:#18537e}.faq-suggestions button:hover{background:#d6eafd}
.gap-item{margin-bottom:12px}.gap-item small{display:block;color:#6c7e90}.gap-item button{margin-top:5px;padding:5px 9px;font-size:12px}.gap-dialog{width:min(500px,calc(100vw - 32px));border:1px solid #cad9e8;border-radius:14px;padding:22px;box-shadow:0 20px 55px #102b4455}.gap-dialog::backdrop{background:#10263d88}.gap-dialog textarea{min-height:90px}.gap-dialog .row{margin-top:16px}
.trained-list{max-height:360px;overflow:auto;padding-left:0;list-style:none}.trained-list li{padding:9px 0;border-bottom:1px solid #e4ebf2}.trained-list strong,.trained-list span{display:block;overflow-wrap:anywhere}.trained-list span{white-space:pre-wrap;color:#50637a}.trained-list small{color:#6c7e90}
.feedback-controls{max-width:90%;margin:0 0 12px}.feedback-controls .row button{padding:6px 10px;font-size:12px}.feedback-controls .hint{margin:5px 0}.feedback-controls button:disabled{opacity:.65;cursor:default}
.followups{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px}.followups span{font-size:12px;color:#66788b}.followups button{padding:5px 8px;background:#e1edf7;color:#155682;font-size:12px}.followups button:hover{background:#cce2f4}
@media(max-width:820px){.layout{grid-template-columns:1fr}.chat{min-height:570px}.messages{max-height:430px}.sidebar{margin-bottom:20px}}
@media(max-width:520px){.scope-fields{grid-template-columns:minmax(0,1fr) 112px}.composer-actions .secondary{padding:9px 7px}}
</style>
</head>
<body>
<header><h1>产品问答</h1><small>选择产品和版本，直接提问</small></header>
<main class="layout">
<section class="card chat">
<h2>提问</h2>
<div class="scope-fields"><div><label for="product">产品</label><select id="product"></select></div><div><label for="version">版本</label><select id="version"></select></div></div>
<div id="messages" class="messages"><details id="productChooser" class="product-chooser" open><summary id="productChooserTitle">正在加载可咨询的产品…</summary><div id="productChooserContent"></div></details><div id="conversation"></div></div>
<div class="composer">
<p id="currentScope" class="hint">当前未选择产品</p>
<textarea id="question" aria-label="产品问题" placeholder="请输入产品问题…"></textarea>
<div class="composer-actions"><button id="send">发送问题</button><button id="switchProduct" class="secondary">换产品</button><button id="reset" class="secondary">新会话</button></div>
<details class="search-tools"><summary>按名称或功能查找产品</summary><div class="search-row"><input id="productSearch" aria-label="产品搜索" placeholder="输入产品名称或功能"><button id="searchButton">查找</button></div></details>
</div>
</section>
<aside class="card sidebar"><h2>知识库管理</h2><p class="hint section-note">需要时展开下面的工具。</p>
<details id="knowledgeDetails"><summary>导入资料与产品</summary>
<label>产品 ID</label><input id="newId" placeholder="例如 demo_product">
<label>产品名称</label><input id="newName" placeholder="例如 演示产品">
<button id="addProduct" style="margin-top:9px">添加产品</button>
<label>类别</label><input id="category" value="产品说明">
<label>上传资料</label><input id="file" type="file" accept=".txt,.md,.html,.htm,.docx,.pdf">
<button id="upload" style="margin-top:9px">导入到当前产品/版本</button>
<p id="adminMsg" class="hint"></p><ul id="docs"></ul>
</details>
<details id="trainingDetails"><summary>整理产品话术</summary>
<button id="trainFaqs" type="button" style="width:100%;margin:12px 0 4px">从资料生成问答</button>
<p id="trainMsg" class="hint" aria-live="polite">按需整理已有资料，只补充有原文依据的问答。</p>
<p id="trainedScope" class="hint"></p><ul id="trainedFaqs" class="trained-list"></ul>
</details>
<details id="gapsDetails"><summary>补充问答与知识缺口 <span id="gapCount"></span></summary>
<button id="manualFaqButton" type="button" style="width:100%;margin:12px 0 8px">+ 手动补充问答</button>
<ul id="unanswered"></ul>
</details>
<details id="metricsDetails"><summary>使用统计</summary><div id="stats" class="stats"></div><div id="chart"></div>
<p class="hint">解决率 = 有知识依据的回答数 / 总提问数。</p><button id="refresh" class="secondary">刷新统计</button></details>
<details id="handoffsDetails"><summary>转人工记录</summary><ul id="handoffs"></ul></details>
</aside>
</main>
<dialog id="gapDialog" class="gap-dialog">
<form id="gapForm">
<h2 id="gapDialogTitle">手动补充问答</h2><p class="hint">核对产品和版本后，以问答格式保存。答案将作为人工补充资料用于后续问答。</p>
<label for="gapProduct">产品</label><select id="gapProduct" required></select>
<label for="gapVersion">版本</label><input id="gapVersion" required maxlength="40" placeholder="例如 2.0">
<label for="gapQuestion">问题</label><textarea id="gapQuestion" required maxlength="500"></textarea>
<label for="gapAnswer">答案</label><textarea id="gapAnswer" required maxlength="4000" placeholder="请填写经核实的产品资料答案"></textarea>
<p id="gapMsg" class="error"></p>
<div class="row"><button type="button" id="cancelGap" class="secondary">取消</button><button type="submit">保存问答</button></div>
</form>
</dialog>
<script>
const $=id=>document.getElementById(id); let sessionId=null,currentGapId=null,citationCounter=0;
async function api(path,opts={}){const r=await fetch(path,opts);const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d}
function node(tag,text,cls){const x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;return x}
function scoreLabel(value){const n=Number(value);return Number.isFinite(n)?Math.round(n*100)+'%':'—'}
function answerBubble(result){
  const bubble=node('div','', 'bubble bot answer-bubble');
  bubble.append(node('div',result.display_answer||result.answer,'answer-text'));
  const citation=node('div','', 'citation');
  const trigger=node('button','!','citation-trigger');trigger.type='button';
  trigger.setAttribute('aria-label','查看知识库来源和相关度');trigger.title='查看知识库来源和相关度';
  trigger.setAttribute('aria-expanded','false');
  const panel=node('div','', 'citation-panel');panel.id='citation-'+(++citationCounter);
  panel.setAttribute('role','region');panel.setAttribute('aria-label','知识库来源和相关度');
  trigger.setAttribute('aria-controls',panel.id);
  const sources=Array.isArray(result.sources)?result.sources:[];
  panel.append(node('strong','知识库来源与相关度'));
  if(sources.length){
    for(const source of sources){
      const item=node('div','', 'citation-source');
      item.append(node('div',`${source.source||'未知来源'} · ${source.category||'未分类'} · 相关度 ${scoreLabel(source.score)}`,'citation-source-label'));
      item.append(node('div',source.text||'','citation-source-text'));panel.append(item);
    }
  }else panel.append(node('div','本条回复未引用知识库资料。'));
  trigger.onclick=()=>{const open=!citation.classList.contains('is-open');citation.classList.toggle('is-open',open);trigger.setAttribute('aria-expanded',String(open))};
  citation.append(trigger,panel);bubble.append(citation);
  if(Array.isArray(result.suggested_questions)&&result.suggested_questions.length){
    const followups=node('div','', 'followups');followups.append(node('span','还可以问：'));
    for(const question of result.suggested_questions){const button=node('button',question);button.type='button';button.onclick=()=>{$('question').value=question;send()};followups.append(button)}
    bubble.append(followups);
  }
  return bubble;
}
function scopeLabel(){const name=$('product').selectedOptions[0]?.text;return $('product').value?`当前：${name} · ${$('version').value||'暂无版本'}`:'当前未选择产品'}
function selectProduct(id){
  if(![...$('product').options].some(o=>o.value===id))return;
  $('product').value=id;versions();docs();sessionId=null;
  $('productChooser').open=false;$('productChooser').hidden=true;
  $('currentScope').textContent=scopeLabel();
  $('conversation').replaceChildren(node('div',`已选择 ${$('product').selectedOptions[0].text}，现在可以询问该产品的功能、参数或使用方法。`,'bubble bot'));
  loadFaqSuggestions();loadTrainedFaqs();
  featured().catch(e=>{$('conversation').append(node('div',e.message,'error'))});
  $('question').focus();
}
function showProductList(items,title,inChooser=true){
  const bubble=inChooser?$('productChooserContent'):node('div','', 'bubble bot');
  if(inChooser){$('productChooserTitle').textContent=title;bubble.replaceChildren()}
  else bubble.replaceChildren(node('div',title));
  if(items.length){
    const list=node('ol','', 'product-list');
    for(const p of items){const li=node('li','');const b=node('button',p.name,'product-link');b.type='button';b.onclick=()=>selectProduct(p.id);li.append(b);list.append(li)}
    bubble.append(list);
  }else bubble.append(node('div','还没有可咨询的产品，请在右侧“导入资料与产品”中添加产品和文档。'));
  if(!inChooser)$('conversation').append(bubble);
}
async function featured(){
  const items=await api('/api/products/featured');
  if(!items.length)$('knowledgeDetails').open=true;
  const ranked=items.some(p=>p.consultation_count>0);
  showProductList(items,ranked?'欢迎！请选择下列热门产品开始问答（按咨询次数排序，最多 6 个）：':'欢迎！请选择下列已有知识库的产品开始问答：');
}
async function switchProduct(){
  sessionId=null;$('product').value='';versions();docs();$('currentScope').textContent=scopeLabel();
  const items=await api('/api/products/catalog');
  showProductList(items,'请选择要切换到的产品：');
  $('productChooser').hidden=false;$('productChooser').open=true;
  $('conversation').replaceChildren();$('messages').scrollTop=0;
}
async function findProduct(){
  const q=$('productSearch').value.trim();if(!q){await featured();$('productChooser').hidden=false;$('productChooser').open=true;return}
  sessionId=null;$('product').value='';versions();docs();$('currentScope').textContent=scopeLabel();
  const items=await api('/api/products/search?q='+encodeURIComponent(q));
  $('conversation').replaceChildren();
  $('productChooser').hidden=true;
  if(items.length)showProductList(items,'找到可能相关的产品知识库，请点击名称开始问答：',false);
  else $('conversation').append(node('div','未找到匹配的产品知识库，请联系人工客服。','bubble bot'));
}
async function products(){
  const items=await api('/api/products');const current=$('product').value,currentVersion=$('version').value;
  const options=[new Option('请选择产品',''),...items.map(p=>{const o=new Option(p.name,p.id);o.dataset.versions=JSON.stringify(p.versions);return o})];
  $('product').replaceChildren(...options);if(items.some(p=>p.id===current))$('product').value=current;versions();
  if([...$('version').options].some(o=>o.value===currentVersion))$('version').value=currentVersion;
  docs();loadTrainedFaqs();
}
function versions(){const opt=$('product').selectedOptions[0];const list=opt&&opt.dataset.versions?JSON.parse(opt.dataset.versions):[];$('version').replaceChildren(...list.map(v=>new Option(v,v)));if(!list.length)$('version').append(new Option('暂无版本',''))}
function cleaningSummary(c){if(c?.manual)return '人工问答补充';if(!c||!c.input_lines)return '旧文档，请重新上传以应用清洗';return `清洗 ${c.input_lines}→${c.output_lines} 行；空行 ${c.empty_lines_removed}、页码 ${c.page_markers_removed}、相邻重复 ${c.adjacent_duplicates_removed}`}
async function docs(){const id=$('product').value;if(!id){$('docs').replaceChildren();return}const items=await api('/api/documents?product_id='+encodeURIComponent(id));$('docs').replaceChildren(...items.map(d=>node('li',`${d.title} · ${d.version} · ${d.chunks} 段 · ${d.faqs} 个常见问题 · ${cleaningSummary(d.cleaning_report)}`)))}
async function loadFaqSuggestions(){
  const id=$('product').value,version=$('version').value;if(!id||!version)return;
  const old=$('faqSuggestions');if(old)old.remove();
  let faqs;try{faqs=await api('/api/faqs?product_id='+encodeURIComponent(id)+'&version='+encodeURIComponent(version))}catch{return}
  if(id!==$('product').value||version!==$('version').value)return;
  if(!faqs.length)return;
  const panel=node('details','', 'faq-suggestions');panel.id='faqSuggestions';panel.append(node('summary','常见问题 · 点击查看'));
  for(const f of faqs.slice(0,6)){const b=node('button',f.question);b.type='button';b.onclick=()=>{$('question').value=f.question;send()};panel.append(b)}
  $('conversation').append(panel);
}
async function loadTrainedFaqs(){
  const id=$('product').value,version=$('version').value;
  $('trainedScope').textContent=id&&version?`${$('product').selectedOptions[0].text} · ${version}`:'请先选择产品和版本。';
  if(!id||!version){$('trainedFaqs').replaceChildren();return}
  try{
    const faqs=await api('/api/faqs?product_id='+encodeURIComponent(id)+'&version='+encodeURIComponent(version)+'&limit=500');
    if(id!==$('product').value||version!==$('version').value)return;
    $('trainedFaqs').replaceChildren(...(faqs.length?faqs.map(f=>{const li=node('li');li.append(node('strong',f.question),node('span',f.answer),node('small',`${f.source} · ${f.kind==='manual'?'人工补充':f.kind==='trained'?'自我训练':'资料提取'}`));return li}):[node('li','当前范围暂无问答。','hint')]));
  }catch(error){$('trainedFaqs').replaceChildren(node('li',error.message,'error'))}
}
async function refresh(){
  const s=await api('/api/stats');$('stats').replaceChildren(...[['提问',s.questions],['已回答',s.answered],['有帮助',s.feedback_positive],['没帮助',s.feedback_negative],['自动问答',s.auto_faqs],['待补充',s.open_gap_count],['转人工',s.handoffs],['解决率',Math.round(s.resolution_rate*100)+'%']].map(([k,v])=>{const n=node('div','', 'stat');n.append(node('span',k),node('strong',v));return n}));
  $('gapCount').textContent=s.open_gap_count?`(${s.open_gap_count})`:'';
  $('chart').replaceChildren(...[['有依据回答',s.answered],['转人工',s.handoffs],['资料不足',s.unanswered]].flatMap(([label,value])=>{const caption=node('div',`${label} ${value}`,'barlabel');const bar=node('div','', 'bar');const fill=node('span','');fill.style.width=(s.questions?value/s.questions*100:0)+'%';bar.append(fill);return [caption,bar]}));
  $('unanswered').replaceChildren(...(s.top_unanswered.length?s.top_unanswered.map(x=>{const li=node('li','', 'gap-item');li.append(node('span',x.question),node('small',`${x.product_name}${x.version?' · '+x.version:''} · ${x.count} 次`));const b=node('button','+ 补充答案','secondary');b.type='button';b.onclick=()=>openGap(x);li.append(b);return li}):[node('li','暂无未解决的知识缺口。','hint')]));const h=await api('/api/handoffs');$('handoffs').replaceChildren(...h.slice(0,5).map(x=>node('li',x.summary)));
}
function feedbackControls(result){
  const panel=node('div','', 'feedback-controls'),row=node('div','', 'row'),message=node('p','','hint');
  const buttons=[];
  for(const [label,rating] of [['有帮助',1],['没帮助',-1]]){
    const button=node('button',label,'secondary');button.type='button';buttons.push(button);
    button.onclick=async()=>{
      buttons.forEach(b=>b.disabled=true);message.className='hint';message.textContent='正在保存评价…';
      try{
        await api('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:result.session_id,message_id:result.message_id,rating})});
        message.textContent=rating===1?'已记录“有帮助”，谢谢反馈。':'已记录“没帮助”，可在知识库管理中补充问答。';
        await refresh().catch(()=>{});
      }catch(error){message.className='error';message.textContent='评价保存失败：'+error.message;buttons.forEach(b=>b.disabled=false)}
    };row.append(button);
  }
  panel.append(row,message);return panel;
}
async function openGap(gap=null){
  currentGapId=gap?.id??null;$('gapMsg').textContent='';$('gapDialogTitle').textContent=gap?'补充知识缺口':'手动补充问答';
  try{
    const items=await api('/api/products');
    $('gapProduct').replaceChildren(new Option('请选择产品',''),...items.map(p=>{const option=new Option(p.name,p.id);option.dataset.versions=JSON.stringify(p.versions);return option}));
    $('gapProduct').value=gap?.product_id||$('product').value||'';
    $('gapVersion').value=gap?.version||($('gapProduct').value===$('product').value?$('version').value:'')||($('gapProduct').selectedOptions[0]?.dataset.versions?JSON.parse($('gapProduct').selectedOptions[0].dataset.versions)[0]:'')||'1.0';
    $('gapQuestion').value=gap?.question||'';$('gapAnswer').value='';$('gapDialog').showModal();
  }catch(e){$('adminMsg').textContent=e.message}
}
$('manualFaqButton').onclick=()=>openGap();
$('trainFaqs').onclick=async()=>{
  const button=$('trainFaqs');button.disabled=true;$('trainMsg').textContent='正在整理已有产品资料…';
  try{
    const scope=$('product').value&&$('version').value?'?product_id='+encodeURIComponent($('product').value)+'&version='+encodeURIComponent($('version').value):'';
    const result=await api('/api/faqs/train'+scope,{method:'POST'});
    $('trainMsg').textContent=`已扫描 ${result.documents_scanned} 份资料，新增 ${result.faqs_added} 条问答。`;
    await refresh();await loadTrainedFaqs();await docs();
    if($('product').value&&$('version').value)await loadFaqSuggestions();
  }catch(error){$('trainMsg').textContent='整理失败：'+error.message}
  finally{button.disabled=false}
};
$('gapProduct').onchange=()=>{const raw=$('gapProduct').selectedOptions[0]?.dataset.versions;const versions=raw?JSON.parse(raw):[];$('gapVersion').value=versions[0]||'1.0'};
$('cancelGap').onclick=()=>$('gapDialog').close();
$('gapForm').onsubmit=async e=>{
  e.preventDefault();
  const save=e.currentTarget.querySelector('button[type=submit]');save.disabled=true;$('gapMsg').textContent='';
  try{
    const path=currentGapId===null?'/api/faqs/manual':'/api/gaps/'+currentGapId+'/answer';
    await api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:$('gapProduct').value,version:$('gapVersion').value,question:$('gapQuestion').value,answer:$('gapAnswer').value})});
    $('gapDialog').close();currentGapId=null;await refresh();await products();await featured();
    if($('product').value===$('gapProduct').value&&$('version').value===$('gapVersion').value){loadFaqSuggestions();loadTrainedFaqs()}
  }catch(err){$('gapMsg').textContent=err.message}finally{save.disabled=false}
};
async function send(){
  const q=$('question').value.trim();if(!q)return;const box=$('conversation');box.append(node('div',q,'bubble user'));$('question').value='';
  try{
    const x=await api('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,session_id:sessionId,product_id:$('product').value||null,version:$('version').value||null})});sessionId=x.session_id;
    if(x.status==='product_found'||(x.status==='no_product'&&!x.product_id)){
      sessionId=null;$('product').value='';versions();docs();$('currentScope').textContent=scopeLabel();
    }
    box.append(answerBubble(x));
    if(x.matched_products&&x.matched_products.length)showProductList(x.matched_products,'点击产品名称开始问答：',false);
    if(x.status==='answered')box.append(feedbackControls(x));
    await refresh();
  }catch(e){box.append(node('div',e.message,'error'))}$('messages').scrollTop=$('messages').scrollHeight;
}
$('send').onclick=send;$('question').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('reset').onclick=()=>{sessionId=null;if($('product').value){$('conversation').replaceChildren(node('div',`已开始 ${$('product').selectedOptions[0].text} 的新会话。`,'bubble bot'));loadFaqSuggestions()}else{$('conversation').replaceChildren();$('productChooser').hidden=false;$('productChooser').open=true;featured()}};
$('switchProduct').onclick=()=>switchProduct().catch(e=>{$('conversation').append(node('div',e.message,'error'))});
$('product').onchange=()=>{if($('product').value)selectProduct($('product').value);else switchProduct()};
$('version').onchange=()=>{sessionId=null;$('currentScope').textContent=scopeLabel();$('conversation').append(node('div',`已切换到 ${$('version').value} 版本。`,'bubble bot'));loadFaqSuggestions();loadTrainedFaqs()};
$('refresh').onclick=refresh;
$('searchButton').onclick=()=>findProduct().catch(e=>{$('conversation').append(node('div','查找失败，请刷新页面后重试。','error'))});
$('productSearch').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('searchButton').click()}};
$('addProduct').onclick=async()=>{try{await api('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('newId').value,name:$('newName').value})});$('adminMsg').textContent='产品已添加';await products();selectProduct($('newId').value)}catch(e){$('adminMsg').textContent=e.message}};
$('upload').onclick=async()=>{const f=$('file').files[0];if(!$('product').value){$('adminMsg').textContent='请先选择产品';return}if(!f){$('adminMsg').textContent='请先选择文件';return}const form=new FormData();form.append('product_id',$('product').value);form.append('version',$('version').value||'1.0');form.append('category',$('category').value);form.append('title',f.name);form.append('file',f);try{const r=await api('/api/documents',{method:'POST',body:form});$('adminMsg').textContent=`导入成功：${r.chunks} 个片段、${r.faqs} 个常见问题；${cleaningSummary(r.cleaning)}`;await products();$('currentScope').textContent=scopeLabel();loadFaqSuggestions()}catch(e){$('adminMsg').textContent=e.message}};
products().then(featured).then(refresh).catch(e=>{$('productChooserTitle').textContent='产品列表加载失败，请刷新页面后重试。';$('conversation').append(node('div',e.message,'error'))});
</script>
</body>
</html>
